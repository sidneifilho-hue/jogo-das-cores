<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Compra</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="central">
    <h2>Calculadora de Compra</h2>

    <div class="input-group">
      <label for="preco">Preço do produto (R$):</label>
      <input type="number" id="preco" placeholder="Ex.: 100" step="0.01" min="0">
    </div>

    <div class="input-group">
      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" placeholder="Ex.: 2" min="1">
    </div>

    <div class="input-group">
      <label for="desconto">Desconto (%):</label>
      <input type="number" id="desconto" placeholder="Ex.: 10" step="0.01" min="0" max="100">
    </div>

    <button id="btnCalcular" class="btn-calcular">Calcular Valor Final</button>

    <div id="resultado" class="resultado-box"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
